<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, Poster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Space Grotesk',system-ui,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.press{transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
.press:active{transform:scale(.97)}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.beat{animation:beat 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.beat{animation:none}.press{transition:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:1040px;box-sizing:border-box;background:#000;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px;color:#EDE6D3;overflow:hidden">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;height:116px;flex:none">
    <div style="font-family:'JetBrains Mono',monospace;font-weight:500;font-size:46px;line-height:1;letter-spacing:-0.04em">10<span style="display:block;font-size:20px;line-height:1.1;color:rgba(237,230,211,0.5)">/</span>09</div>
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="display:flex;gap:6px;height:116px">
        <span aria-hidden="true" style="writing-mode:vertical-rl;font-family:'Zen Kaku Gothic New',sans-serif;font-size:22px;font-weight:700;letter-spacing:0.24em">時間収支</span>
        <span style="writing-mode:vertical-rl;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(237,230,211,0.62);padding-top:2px">THIRD TIME</span>
      </div>
      <span aria-hidden="true" style="width:40px;height:40px;border-radius:8px;background:#D9503A;color:#EDE6D3;display:flex;align-items:center;justify-content:center;font-family:'Zen Kaku Gothic New',sans-serif;font-size:26px;font-weight:700;transform:rotate(4deg)">三</span>
      <button type="button" aria-label="Settings" class="press" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(237,230,211,0.16);background:transparent;color:#EDE6D3;display:flex;align-items:center;justify-content:center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>

  <section aria-label="Timer" style="position:relative;height:340px;flex:none">
    <div aria-hidden="true" style="position:absolute;left:-44px;top:96px;width:230px;height:230px;border-radius:50%;background-color:{{discBg}};transition:background-color .6s cubic-bezier(.2,.8,.2,1)"></div>

    <div style="position:absolute;left:36px;top:0;width:322px;box-sizing:border-box;padding:14px 16px 12px;border:1px solid rgba(237,230,211,0.5);background:#000">
      <div style="display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.14em">
        <span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:22px;letter-spacing:0">{{kanji}}</span>
        <span class="beat" style="width:8px;height:8px;border-radius:50%;background:currentColor"></span>{{label}}
      </div>
      <p data-testid="elapsed" style="margin:8px 0 12px;font-family:'JetBrains Mono',monospace;font-size:{{digitSize}}px;font-weight:700;line-height:1;letter-spacing:-0.05em">{{elapsedText}}</p>
      <div aria-label="Daily Should target {{targetPct}} percent" role="img" style="display:flex;align-items:flex-end;gap:3px;height:20px">
        <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="30"><span style="flex:1;border-radius:1px;background-color:{{tk.color}};height:{{tk.h}}px;transition:background-color .3s"></span></sc-for>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(237,230,211,0.62)"><span>TARGET {{targetPct}}%</span><span>S {{shouldText}} · W {{wantText}}</span></div>
    </div>

    <div style="position:absolute;right:0;top:206px;width:224px;box-sizing:border-box;padding:12px 16px 14px;border:1px solid rgba(237,230,211,0.5);background:#000">
      <p style="margin:0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:rgba(237,230,211,0.62)">{{balanceLabel}}</p>
      <p data-testid="balance" style="margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:50px;font-weight:700;line-height:1;letter-spacing:-0.05em;color:{{balanceColor}};transition:color .4s">{{balanceText}}</p>
      <div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(237,230,211,0.16);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(237,230,211,0.62)">SHOULD EARNS 1:3 · WANT SPENDS 1:1</div>
    </div>
  </section>

  <div role="group" aria-label="Timer state" style="display:flex;flex-direction:column;gap:10px">
    <button type="button" class="press" aria-pressed="{{isShould}}" onClick="{{pickShould}}" style="min-height:64px;border-radius:18px;padding:0 18px;display:flex;align-items:center;gap:14px;border:0;background-color:#2F6B4A;color:#EDE6D3;opacity:{{shouldOpacity}};box-shadow:{{shouldRing}};transition:opacity .3s,box-shadow .3s">
      <span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:30px;font-weight:700;width:34px">務</span>
      <span style="font-size:26px;font-weight:700;letter-spacing:-0.02em">Should</span>
      <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em">{{shouldSub}}</span>
    </button>
    <button type="button" class="press" aria-pressed="{{isWant}}" onClick="{{pickWant}}" style="min-height:64px;border-radius:18px;padding:0 18px;display:flex;align-items:center;gap:14px;border:0;background-color:#EDE6D3;color:#06120B;opacity:{{wantOpacity}};box-shadow:{{wantRing}};transition:opacity .3s,box-shadow .3s">
      <span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:30px;font-weight:700;width:34px">望</span>
      <span style="font-size:26px;font-weight:700;letter-spacing:-0.02em">Want</span>
      <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em">{{wantSub}}</span>
    </button>
  </div>

  <div style="display:grid;grid-template-rows:{{stopRows}};margin-top:{{stopMt}}px;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),margin-top .35s cubic-bezier(.2,.8,.2,1)">
    <div style="min-height:0;overflow:hidden;visibility:{{stopVis}};opacity:{{stopOpacity}};transition:opacity .3s,visibility 0s linear {{stopDelay}}">
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <button type="button" class="press" onClick="{{stop}}" style="min-height:48px;border-radius:24px;border:1px solid rgba(237,230,211,0.5);background:transparent;color:#EDE6D3;font-size:16px;font-weight:600">Stop</button>
        <button type="button" class="press" style="min-height:48px;border-radius:24px;border:1px solid rgba(237,230,211,0.16);background:transparent;color:rgba(237,230,211,0.7);font-size:16px;font-weight:500">Fix timer</button>
      </div>
    </div>
  </div>

  <section aria-label="Should" style="position:relative;margin-top:8px;border:1px solid rgba(237,230,211,0.24);padding:14px 12px 4px 14px">
    <h2 style="position:absolute;left:12px;top:-12px;margin:0;padding:0 8px;background:#000;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-0.01em"><span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif;color:#86B594">務</span>Should</h2>
    <span style="position:absolute;right:12px;top:-8px;padding:0 8px;background:#000;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(237,230,211,0.62)">{{shouldCount}}</span>
    <ul style="list-style:none;margin:0;padding:0">
      <sc-for list="{{shouldItems}}" as="item" hint-placeholder-count="3">
        <li style="display:flex;align-items:center;gap:6px;min-height:52px">
          <button type="button" role="checkbox" aria-checked="{{item.done}}" aria-label="{{item.text}}" onClick="{{item.toggle}}" class="press" style="flex:none;width:44px;height:44px;margin-left:-8px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26"><rect x="1.5" y="1.5" width="23" height="23" rx="5" stroke="#86B594" stroke-width="2" style="fill:{{item.fill}};transition:fill .22s"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="#06120B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20" style="stroke-dashoffset:{{item.dash}};transition:stroke-dashoffset .3s cubic-bezier(.3,1,.4,1) .05s"/></svg>
          </button>
          <div style="flex:1;min-width:0;padding:6px 0">
            <span style="display:block;font-size:17px;font-weight:500;color:{{item.ink}};text-decoration:{{item.strike}};transition:color .25s">{{item.text}}</span>
            <sc-if value="{{item.note}}" hint-placeholder-val="{{ true }}"><span style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:{{item.noteColor}}">{{item.note}}</span></sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>

  <section aria-label="Want" style="position:relative;margin-top:8px;border:1px solid rgba(237,230,211,0.24);padding:14px 12px 4px 14px">
    <h2 style="position:absolute;left:12px;top:-12px;margin:0;padding:0 8px;background:#000;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-0.01em"><span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif">望</span>Want</h2>
    <span style="position:absolute;right:12px;top:-8px;padding:0 8px;background:#000;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(237,230,211,0.62)">{{wantCount}}</span>
    <ul style="list-style:none;margin:0;padding:0">
      <sc-for list="{{wantItems}}" as="item" hint-placeholder-count="2">
        <li style="display:flex;align-items:center;gap:6px;min-height:52px">
          <button type="button" role="checkbox" aria-checked="{{item.done}}" aria-label="{{item.text}}" onClick="{{item.toggle}}" class="press" style="flex:none;width:44px;height:44px;margin-left:-8px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" stroke="#EDE6D3" stroke-width="2" style="fill:{{item.fill}};transition:fill .22s"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="#06120B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20" style="stroke-dashoffset:{{item.dash}};transition:stroke-dashoffset .3s cubic-bezier(.3,1,.4,1) .05s"/></svg>
          </button>
          <div style="flex:1;min-width:0;padding:6px 0">
            <span style="display:block;font-size:17px;font-weight:500;color:{{item.ink}};text-decoration:{{item.strike}};transition:color .25s">{{item.text}}</span>
            <sc-if value="{{item.note}}" hint-placeholder-val="{{ true }}"><span style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:{{item.noteColor}}">{{item.note}}</span></sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="Views" style="margin-top:auto;display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px;background:#000;border:1px solid rgba(237,230,211,0.16)">
    <button type="button" aria-pressed="true" class="press" style="flex:1;min-height:48px;border-radius:24px;border:0;background:#EDE6D3;color:#06120B;font-size:15px;font-weight:700">Today</button>
    <button type="button" aria-pressed="false" class="press" style="flex:1;min-height:48px;border-radius:24px;border:0;background:transparent;color:rgba(237,230,211,0.7);font-size:15px;font-weight:600">Later</button>
    <button type="button" aria-label="Add item" class="press" style="flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(237,230,211,0.5);background:transparent;color:#EDE6D3;display:flex;align-items:center;justify-content:center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { mode: 'rest', elapsed: 0, balance: 1450, should: 4320, want: 0, done: { s3: true } };

  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }

  tick() {
    const s = this.state;
    if (s.mode === 'should') this.setState({ elapsed: s.elapsed + 1, balance: s.balance + 1 / 3, should: s.should + 1 });
    else if (s.mode === 'want') this.setState({ elapsed: s.elapsed + 1, balance: s.balance - 1, want: s.want + 1 });
  }

  pad(n) { return String(n).padStart(2, '0'); }
  clock(sec) {
    const a = Math.floor(Math.abs(sec));
    const h = Math.floor(a / 3600), m = Math.floor((a % 3600) / 60), s = a % 60;
    return (sec < 0 ? '-' : '') + (h ? h + ':' + this.pad(m) : m) + ':' + this.pad(s);
  }
  dur(sec) {
    const m = Math.floor(sec / 60), h = Math.floor(m / 60);
    return h ? h + 'h' + this.pad(m % 60) : m + 'm';
  }

  renderVals() {
    const s = this.state;
    const PAPER = '#EDE6D3', FOREST = '#2F6B4A', MOSS = '#86B594', RED = '#E5604A';
    const mode = s.mode, rest = mode === 'rest', debt = s.balance < 0;
    const progress = Math.min(1, s.should / 12000);
    const ring = (on) => on ? '0 0 0 3px #000, 0 0 0 5px ' + PAPER : '0 0 0 0 #000';
    const lit = Math.round(progress * 30);
    const ticks = Array.from({ length: 30 }, (_, i) => ({
      color: i < lit ? MOSS : 'rgba(237,230,211,0.2)', h: i % 5 === 0 ? 20 : 12,
    }));
    const mk = (list, accent) => list.map((it) => {
      const done = !!s.done[it.id];
      return {
        text: it.text, note: it.note || '', noteColor: it.late ? RED : 'rgba(237,230,211,0.62)',
        done: done, fill: done ? accent : 'transparent', dash: done ? 0 : 20,
        ink: done ? 'rgba(237,230,211,0.5)' : PAPER, strike: done ? 'line-through' : 'none',
        toggle: () => this.setState({ done: { ...s.done, [it.id]: !done } }),
      };
    });
    const sItems = [
      { id: 's1', text: 'Pay the electricity bill', note: '2 DAYS OVERDUE', late: true },
      { id: 's2', text: 'Write the quarterly report' },
      { id: 's3', text: 'Clear the inbox', note: '↻ EVERY WEEKDAY' },
    ];
    const wItems = [
      { id: 'w1', text: 'Practice guitar' },
      { id: 'w2', text: 'Read a chapter', note: '↻ DAILY' },
    ];
    const count = (list) => list.filter((i) => s.done[i.id]).length + '/' + list.length;
    const elapsedText = rest ? '0:00' : this.clock(s.elapsed);
    return {
      discBg: rest ? '#14301F' : (mode === 'should' ? FOREST : PAPER),
      kanji: rest ? '休' : (mode === 'should' ? '務' : '望'),
      label: rest ? 'RESTING' : (mode === 'should' ? 'SHOULD RUNNING' : 'WANT RUNNING'),
      elapsedText, digitSize: elapsedText.length > 5 ? 56 : 78, ticks, targetPct: Math.round(progress * 100),
      shouldText: this.dur(s.should), wantText: this.dur(s.want),
      balanceLabel: debt ? 'WANT DEBT' : 'WANT AVAILABLE',
      balanceText: this.clock(s.balance), balanceColor: debt ? RED : PAPER,
      isShould: mode === 'should', isWant: mode === 'want',
      shouldOpacity: mode === 'want' ? 0.45 : 1, wantOpacity: mode === 'should' ? 0.45 : 1,
      shouldRing: ring(mode === 'should'), wantRing: ring(mode === 'want'),
      shouldSub: mode === 'should' ? 'RUNNING' : 'EARNS 1:3', wantSub: mode === 'want' ? 'RUNNING' : 'SPENDS 1:1',
      stopRows: rest ? '0fr' : '1fr', stopMt: rest ? -14 : 0, stopVis: rest ? 'hidden' : 'visible',
      stopOpacity: rest ? 0 : 1, stopDelay: rest ? '.35s' : '0s',
      pickShould: () => this.setState({ mode: 'should', elapsed: 0 }),
      pickWant: () => this.setState({ mode: 'want', elapsed: 0 }),
      stop: () => this.setState({ mode: 'rest', elapsed: 0 }),
      shouldItems: mk(sItems, MOSS), wantItems: mk(wItems, PAPER),
      shouldCount: count(sItems), wantCount: count(wItems),
    };
  }
}
</script>
</body>
</html>
